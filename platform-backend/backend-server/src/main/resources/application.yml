server:
  port: 8080
  shutdown: graceful          # K8s/滚动更新期间处理完存量请求再退（§6.12）

spring:
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # 文件上传限制（§19.1）：与 alioss max-size 对齐
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${onsite.datasource.driver-class-name}
      url: jdbc:mysql://${onsite.datasource.host}:${onsite.datasource.port}/${onsite.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${onsite.datasource.username}
      password: ${onsite.datasource.password}
  redis:
    host: ${onsite.redis.host}
    port: ${onsite.redis.port}
    password: ${onsite.redis.password}
    database: ${onsite.redis.database} #默认数据库是0，可不配置
    # === 无 Redis 环境降级配置（本机未安装 Redis 时，不阻塞 Spring Boot 启动） ===
    # - 启动时不校验连接池可用性；所有 redis 操作由业务层 try/catch 并降级
    # - Lettuce 关闭重试/缩短超时，避免每次读 DB 前在 Redis 上等很久
    lettuce:
      pool:
        enabled: false          # 不用共享连接池（无 Redis 时更快失败）
      shutdown-timeout: 50ms
    connect-timeout: 150ms     # TCP 建连超时（127.0.0.1 上 Redis 没启动的话 150ms 就失败）
    timeout: 150ms             # 读超时

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.onsitefitness.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      onsitefitness:
        mapper: debug
        service: info
        controller: info

# Actuator 探针 + Prometheus 指标导出（§5.11 / §5.27）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

onsite:
  jwt:
    # JWT 签名密钥：一律从环境变量注入，缺省空值 → 启动失败（§6.14 快速失败）
    # 开发环境弱默认见 application-dev.yml；生产密钥写入 .env（git 历史视为已泄露，需轮换）
    admin-secret-key: ${ONSITE_JWT_ADMIN_KEY:}
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: ${ONSITE_JWT_USER_KEY:}
    user-ttl: 7200000
    user-token-name: authentication
    # 教练端
    coach-secret-key: ${ONSITE_JWT_COACH_KEY:}
    coach-ttl: 7200000
    coach-token-name: token
  encrypt:
    # 敏感信息(身份证号等)AES 加密密钥(16/24/32 字节)，从环境变量注入
    aes-key: ${ONSITE_AES_KEY:}
  alioss:
    endpoint: ${onsite.alioss.endpoint}
    access-key-id: ${onsite.alioss.access-key-id}
    access-key-secret: ${onsite.alioss.access-key-secret}
    bucket-name: ${onsite.alioss.bucket-name}
    # 设置上传文件大小限制
    max-size: 10485760
  wechat:
    appid: ${onsite.wx.app-id}
    secret: ${onsite.wx.app-secret}
    mchid: ${onsite.wx.mch-id}
    mchSerialNo: ${onsite.wx.mcg-serial-no}
    privateKeyFilePath: ${onsite.wx.private-key-path}
    apiV3Key: ${onsite.wx.api-v3-key}
    weChatPayCertFilePath: ${onsite.wx.wechat-pay-cert-path}
    notifyUrl: ${onsite.wx.notify-url}
    refundNotifyUrl: ${onsite.wx.refund-notify-url}
  shop:
    address: ${onsite.shop.address}
  baidu:
    ak: ${onsite.baidu.ak}

